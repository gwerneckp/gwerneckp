name: Generate snake animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # banner / avatar palette: navy #1d2b53, DitchCarbon emerald #23885c and lime #abe734
            dist/github-snake.svg?color_snake=#1d2b53&color_dots=#ebedf0,#d4f2a0,#abe734,#4fb35a,#23885c
            dist/github-snake-dark.svg?color_snake=#abe734&color_dots=#2c3a6b,#1b5e45,#23885c,#3fae5a,#7fd24a
            
      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
